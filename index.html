<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いい街こまつプレミアム 取扱店検索</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.1);
            --radius-md: 12px;
            --radius-full: 9999px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ヒーローヘッダー */
        .hero {
            background: var(--primary-gradient);
            color: white;
            padding: 40px 20px 60px;
            text-align: center;
        }
        .hero h1 {
            margin: 0 0 8px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .hero p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* メインコンテナ */
        .container {
            max-width: 800px;
            margin: -30px auto 40px;
            padding: 0 20px;
        }

        /* 検索コントロールカード */
        .search-card {
            background: var(--surface-color);
            padding: 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 24px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 入力フォーム共通 */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            fill: var(--text-sub);
            pointer-events: none;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 15px;
            color: var(--text-main);
            background-color: #f1f5f9;
            border: 1.5px solid transparent;
            border-radius: 8px;
            transition: all 0.2s ease;
            appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            background-color: var(--surface-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        /* 検索結果ヘッダー */
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .results-count {
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .count-badge {
            background-color: #dbeafe;
            color: var(--primary-color);
            padding: 2px 10px;
            border-radius: var(--radius-full);
            font-weight: 700;
        }

        /* 店舗カードリスト */
        .store-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .store-card {
            background: var(--surface-color);
            border-radius: var(--radius-md);
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .store-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        .store-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .store-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
            line-height: 1.4;
        }

        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge-category {
            background-color: #eff6ff;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--radius-full);
        }

        .badge-facility {
            background-color: #f1f5f9;
            color: #475569;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--radius-full);
        }

        .store-address {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            font-size: 14px;
            color: var(--text-sub);
            margin: 0;
        }

        .store-address svg {
            width: 16px;
            height: 16px;
            fill: var(--text-sub);
            flex-shrink: 0;
            margin-top: 3px;
        }

        /* 空の状態・ローディング */
        .status-box {
            text-align: center;
            padding: 40px 20px;
            background: var(--surface-color);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
        }

        /* 画面幅が広い場合（タブレット・PC） */
        @media (min-width: 640px) {
            .hero h1 {
                font-size: 32px;
            }
            .search-grid {
                grid-template-columns: 1fr 1fr;
            }
            .store-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-start;
            }
            .tag-group {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

<!-- ヒーローエリア -->
<header class="hero">
    <h1>いい街こまつプレミアム</h1>
    <p>加盟店・取扱店 リアルタイム検索</p>
</header>

<!-- メインコンテンツ -->
<main class="container">
    <!-- 検索フィルターカード -->
    <section class="search-card">
        <div class="search-grid">
            <!-- キーワード検索 -->
            <div class="form-group">
                <label for="searchInput">キーワードで探す</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="searchInput" placeholder="店舗名、住所など...">
                </div>
            </div>
            
            <!-- カテゴリ選択 -->
            <div class="form-group">
                <label for="categorySelect">ジャンルで絞り込む</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
                    <select id="categorySelect">
                        <option value="">すべてのジャンル</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- 件数表示 -->
    <div class="results-header">
        <div id="resultsCount" class="results-count">データを読み込み中...</div>
    </div>
    
    <!-- 検索結果一覧 -->
    <div id="results" class="store-list">
        <div class="status-box">データを読み込んでいます...</div>
    </div>
</main>

<script>
    let allStores = [];

    // JSONデータの読み込み
    async function loadStores() {
        try {
            // ⚠️ GitHubのリポジトリ上のファイル名に合わせて変更してください
            const response = await fetch('komatsu_premium_merchants_2026.json');
            
            if (!response.ok) {
                throw new Error('ファイルの読み込みに失敗しました');
            }
            
            const data = await response.json();
            
            // 複合商業施設データの整形
            if (data.complex_facilities) {
                data.complex_facilities.forEach(facility => {
                    facility.stores.forEach(store => {
                        allStores.push({
                            name: store.store_name,
                            category: store.category,
                            address: facility.address,
                            locationType: facility.facility_name
                        });
                    });
                });
            }

            // 独立店舗データの整形
            if (data.independent_stores_by_category) {
                for (const [category, stores] of Object.entries(data.independent_stores_by_category)) {
                    stores.forEach(store => {
                        allStores.push({
                            name: store.store_name,
                            category: category,
                            address: store.address,
                            locationType: '独立店舗'
                        });
                    });
                }
            }

            setupCategoryDropdown();
            renderStores(allStores);
            
        } catch (error) {
            console.error('エラー:', error);
            document.getElementById('results').innerHTML = `
                <div class="status-box" style="color: #ef4444;">
                    データの読み込みに失敗しました。<br>JSONファイル名とフォルダの場所を再確認してください。
                </div>
            `;
            document.getElementById('resultsCount').textContent = '';
        }
    }

    // カテゴリのドロップダウン作成
    function setupCategoryDropdown() {
        const categorySelect = document.getElementById('categorySelect');
        const categories = [...new Set(allStores.map(store => store.category))].sort();

        categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = category;
            categorySelect.appendChild(option);
        });
    }

    // 検索・フィルタリング処理
    function filterStores() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const selectedCategory = document.getElementById('categorySelect').value;

        const filtered = allStores.filter(store => {
            const matchCategory = selectedCategory === "" || store.category === selectedCategory;
            const matchQuery = query === "" || 
                               store.name.toLowerCase().includes(query) || 
                               store.address.toLowerCase().includes(query) ||
                               store.locationType.toLowerCase().includes(query);

            return matchCategory && matchQuery;
        });

        renderStores(filtered);
    }

    // 店舗一覧の描画処理
    function renderStores(stores) {
        const resultsCount = document.getElementById('resultsCount');
        const resultsDiv = document.getElementById('results');
        
        resultsDiv.innerHTML = '';

        if (stores.length === 0) {
            resultsCount.innerHTML = '検索結果: <span class="count-badge">0 件</span>';
            resultsDiv.innerHTML = `
                <div class="status-box">
                    条件に一致する店舗が見つかりませんでした。<br>別のキーワードをお試しください。
                </div>
            `;
            return;
        }

        resultsCount.innerHTML = `検索結果: <span class="count-badge">${stores.length} 件</span>`;

        stores.forEach(store => {
            const card = document.createElement('article');
            card.className = 'store-card';
            
            const isFacility = store.locationType !== '独立店舗';
            
            card.innerHTML = `
                <div class="store-header">
                    <h2 class="store-name">${escapeHtml(store.name)}</h2>
                    <div class="tag-group">
                        <span class="badge-category">${escapeHtml(store.category)}</span>
                        ${isFacility ? `<span class="badge-facility">🏬 ${escapeHtml(store.locationType)}</span>` : ''}
                    </div>
                </div>
                <p class="store-address">
                    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    <span>${escapeHtml(store.address)}</span>
                </p>
            `;
            resultsDiv.appendChild(card);
        });
    }

    // XSS対策用テキストエスケープ関数
    function escapeHtml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // イベントリスナー設定
    document.getElementById('searchInput').addEventListener('input', filterStores);
    document.getElementById('categorySelect').addEventListener('change', filterStores);

    window.onload = loadStores;
</script>

</body>
</html>
