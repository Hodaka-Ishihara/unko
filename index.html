<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いい街こまつプレミアム 取扱店検索</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
        }
        
        /* 検索コントロールエリア */
        .search-controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], select {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            background-color: #fafafa;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
        }

        /* 検索結果エリア */
        .results-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .store-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary-color);
            transition: transform 0.2s;
        }
        .store-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .store-name {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 8px 0;
            color: #222;
        }
        .store-category {
            display: inline-block;
            background-color: #e9ecef;
            color: #495057;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .store-address {
            font-size: 14px;
            color: #555;
            margin: 0;
            display: flex;
            align-items: center;
        }
        .store-address::before {
            content: "📍";
            margin-right: 5px;
        }
        
        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }
        
        /* スマホ向けの微調整 */
        @media (min-width: 600px) {
            .search-controls {
                flex-direction: row;
            }
            .input-group {
                flex: 1;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>いい街こまつプレミアム 取扱店検索</h1>
    
    <div class="search-controls">
        <!-- キーワード検索 -->
        <div class="input-group">
            <label for="searchInput">キーワード検索</label>
            <input type="text" id="searchInput" placeholder="店舗名、住所など...">
        </div>
        
        <!-- カテゴリ絞り込み -->
        <div class="input-group">
            <label for="categorySelect">カテゴリで絞り込み</label>
            <select id="categorySelect">
                <option value="">すべてのカテゴリ</option>
                <!-- JavaScriptで自動追加されます -->
            </select>
        </div>
    </div>

    <div id="resultsInfo" class="results-info">データを読み込んでいます...</div>
    
    <div id="results">
        <!-- 検索結果がここに表示されます -->
    </div>
</div>

<script>
    let allStores = [];

    // JSONファイルの読み込みとデータ構築
    async function loadStores() {
        try {
            // ⚠️ GitHubでのファイル名に合わせて修正してください（例: komatsu_premium_merchants_2026.json）
            const response = await fetch('komatsu_premium_merchants_2026.json');
            
            if (!response.ok) {
                throw new Error('ファイルの取得に失敗しました');
            }
            
            const data = await response.json();
            
            // 1. 複合商業施設のデータ追加
            if (data.complex_facilities) {
                data.complex_facilities.forEach(facility => {
                    facility.stores.forEach(store => {
                        allStores.push({
                            name: store.store_name,
                            category: store.category,
                            address: facility.address,
                            locationType: facility.facility_name
                        });
                    });
                });
            }

            // 2. 独立店舗のデータ追加
            if (data.independent_stores_by_category) {
                for (const [category, stores] of Object.entries(data.independent_stores_by_category)) {
                    stores.forEach(store => {
                        allStores.push({
                            name: store.store_name,
                            category: category,
                            address: store.address,
                            locationType: '独立店舗'
                        });
                    });
                }
            }

            // プルダウンにカテゴリ一覧をセット
            setupCategoryDropdown();

            // 初回読み込み完了時、全件表示する
            renderStores(allStores);
            
        } catch (error) {
            console.error('読み込みエラー:', error);
            document.getElementById('resultsInfo').innerHTML = '<span style="color:red;">データの読み込みに失敗しました。ファイル名やパスを確認してください。</span>';
        }
    }

    // カテゴリのプルダウン（Select）を自動生成する関数
    function setupCategoryDropdown() {
        const categorySelect = document.getElementById('categorySelect');
        // 重複を排除してカテゴリのリストを作成
        const categories = [...new Set(allStores.map(store => store.category))];
        
        // 五十音順にソート（お好みで）
        categories.sort();

        categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = category;
            categorySelect.appendChild(option);
        });
    }

    // 検索・絞り込み処理
    function filterStores() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const selectedCategory = document.getElementById('categorySelect').value;

        // キーワードとカテゴリの両方でフィルタリング（AND検索）
        const filtered = allStores.filter(store => {
            // カテゴリの判定（何も選択されていない場合は全てTrue）
            const matchCategory = selectedCategory === "" || store.category === selectedCategory;
            
            // キーワードの判定（名前、住所、施設名に含まれるか）
            const matchQuery = query === "" || 
                               store.name.toLowerCase().includes(query) || 
                               store.address.toLowerCase().includes(query) ||
                               store.locationType.toLowerCase().includes(query);

            return matchCategory && matchQuery;
        });

        renderStores(filtered);
    }

    // 画面に店舗一覧を描画する関数
    function renderStores(stores) {
        const resultsInfo = document.getElementById('resultsInfo');
        const resultsDiv = document.getElementById('results');
        
        resultsDiv.innerHTML = ''; // 一旦クリア

        // 件数表示の更新
        if (stores.length === 0) {
            resultsInfo.textContent = '該当する店舗が見つかりませんでした。';
            return;
        } else {
            resultsInfo.textContent = `該当店舗: ${stores.length} 件`;
        }

        // カードの生成
        stores.forEach(store => {
            const card = document.createElement('div');
            card.className = 'store-card';
            
            // 表示用の住所テキスト（複合施設の場合は施設名も併記）
            const locationText = store.locationType === '独立店舗' 
                ? store.address 
                : `${store.address} (${store.locationType})`;

            card.innerHTML = `
                <h3 class="store-name">${store.name}</h3>
                <span class="store-category">${store.category}</span>
                <p class="store-address">${locationText}</p>
            `;
            resultsDiv.appendChild(card);
        });
    }

    // イベントリスナーの設定
    // 1. テキスト入力されるたびに検索実行（インクリメンタルサーチ）
    document.getElementById('searchInput').addEventListener('input', filterStores);
    
    // 2. プルダウンが変更されるたびに検索実行
    document.getElementById('categorySelect').addEventListener('change', filterStores);

    // ページ読み込み時に実行
    window.onload = loadStores;
</script>

</body>
</html>
