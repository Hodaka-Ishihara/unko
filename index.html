<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いい街こまつプレミアム 探せるナビ</title>
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --accent: #f43f5e;
            --bg-base: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-solid: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --shadow-glow: 0 20px 25px -5px rgba(2, 132, 199, 0.15);
            --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-full: 9999px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 0 0 100px;
            background-color: var(--bg-base);
            color: var(--text-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* ヘッダー */
        .hero {
            padding: 48px 24px 32px;
            text-align: center;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: white;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.2);
            position: relative;
            overflow: hidden;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            margin: 0;
            font-size: 13px;
            color: #94a3b8;
        }

        /* コンテナ */
        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ガチャ・おもしろ機能エリア */
        .fun-action-area {
            margin-top: -24px;
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-gacha {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-gacha:active {
            transform: scale(0.95);
        }

        /* ガラス風 検索コントロール */
        .search-card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-glow);
            margin-bottom: 20px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 16px 14px 44px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            background: var(--surface-solid);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            transition: all 0.2s ease;
            appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            padding-right: 44px;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
        }

        /* フィルタータブ */
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--text-main);
            color: white;
            border-color: var(--text-main);
        }

        /* 検索結果ヘッダー */
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
        }

        /* 店舗カードリスト */
        .store-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .store-card {
            background: var(--surface-solid);
            border-radius: var(--radius-lg);
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
            transition: all 0.25s ease;
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .store-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgba(0,0,0,0.08);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .store-name {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
            line-height: 1.35;
        }

        /* アクションボタン（お気に入り・行った） */
        .card-actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            background: var(--bg-base);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .action-btn.fav-btn.active {
            background: #ffe4e6;
            color: var(--accent);
        }

        .action-btn.visited-btn.active {
            background: #dcfce7;
        }

        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: var(--radius-full);
        }

        .badge-category {
            background: #e0f2fe;
            color: var(--primary-dark);
        }

        .badge-facility {
            background: #f1f5f9;
            color: #475569;
        }

        /* 地図リンク */
        .store-address {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-sub);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .store-address:hover {
            color: var(--primary);
        }

        /* モーダル（ガチャ用） */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-body {
            background: white;
            padding: 32px 24px;
            border-radius: var(--radius-lg);
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-body {
            transform: scale(1);
        }

        .modal-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .modal-store-name {
            font-size: 22px;
            font-weight: 900;
            margin: 0 0 16px;
        }

        .btn-modal-close {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        @media (min-width: 640px) {
            .hero h1 { font-size: 36px; }
            .search-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<header class="hero">
    <span class="hero-badge">2026 EDITION</span>
    <h1>いい街こまつプレミアム</h1>
    <p>取扱店 スマート検索ナビ</p>
</header>

<main class="container">
    <!-- ガチャボタン -->
    <div class="fun-action-area">
        <button class="btn-gacha" onclick="runGacha()">
            <span>🎲</span> 今日どこ行く？ガチャ
        </button>
    </div>

    <!-- 検索フィルター -->
    <section class="search-card">
        <div class="search-grid">
            <div class="input-wrapper">
                <span class="input-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="店舗名・キーワード...">
            </div>
            <div class="input-wrapper">
                <span class="input-icon">🏷️</span>
                <select id="categorySelect">
                    <option value="">すべてのジャンル</option>
                </select>
            </div>
        </div>
    </section>

    <!-- 絞り込みタブ -->
    <div class="filter-tabs">
        <button class="tab-btn active" onclick="setTab('all', this)">すべて</button>
        <button class="tab-btn" onclick="setTab('fav', this)">❤️ お気に入り</button>
        <button class="tab-btn" onclick="setTab('visited', this)">✅ 行ったお店</button>
    </div>

    <!-- 結果カウント -->
    <div class="results-header">
        <span id="resultsCount">ロード中...</span>
    </div>

    <!-- 店舗リスト -->
    <div id="results" class="store-list"></div>
</main>

<!-- ガチャ結果モーダル -->
<div id="gachaModal" class="modal-overlay">
    <div class="modal-body">
        <div class="modal-title">✨ TODAY'S PICK UP ✨</div>
        <div id="gachaResultCategory" class="badge badge-category" style="display:inline-block; margin-bottom: 8px;"></div>
        <h2 id="gachaResultName" class="modal-store-name">店舗名</h2>
        <a id="gachaResultMap" href="#" target="_blank" class="store-address">📍 Google Mapsでみる</a>
        <button class="btn-modal-close" onclick="closeGacha()">ここに行く！</button>
    </div>
</div>

<script>
    let allStores = [];
    let currentTab = 'all';
    
    // LocalStorageから状態を復元（保存機能）
    let favorites = JSON.parse(localStorage.getItem('komatsu_favs') || '[]');
    let visited = JSON.parse(localStorage.getItem('komatsu_visited') || '[]');

    async function loadStores() {
        try {
            // ⚠️ GitHub上のファイル名に合わせて変更してください
            const response = await fetch('komatsu_premium_merchants_2026.json');
            if (!response.ok) throw new Error('読み込み失敗');
            
            const data = await response.json();
            
            if (data.complex_facilities) {
                data.complex_facilities.forEach(facility => {
                    facility.stores.forEach(store => {
                        allStores.push({
                            id: store.store_name + '_' + facility.address,
                            name: store.store_name,
                            category: store.category,
                            address: facility.address,
                            locationType: facility.facility_name
                        });
                    });
                });
            }

            if (data.independent_stores_by_category) {
                for (const [category, stores] of Object.entries(data.independent_stores_by_category)) {
                    stores.forEach(store => {
                        allStores.push({
                            id: store.store_name + '_' + store.address,
                            name: store.store_name,
                            category: category,
                            address: store.address,
                            locationType: '独立店舗'
                        });
                    });
                }
            }

            setupCategoryDropdown();
            filterStores();

        } catch (error) {
            document.getElementById('results').innerHTML = `
                <div style="text-align:center; padding: 40px; color: var(--accent);">
                    データの読み込みに失敗しました。<br>ファイル名を確認してください。
                </div>`;
        }
    }

    function setupCategoryDropdown() {
        const select = document.getElementById('categorySelect');
        const categories = [...new Set(allStores.map(s => s.category))].sort();
        categories.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            select.appendChild(opt);
        });
    }

    // フィルタリング＆表示
    function filterStores() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const selectedCat = document.getElementById('categorySelect').value;

        const filtered = allStores.filter(store => {
            const matchCategory = !selectedCat || store.category === selectedCat;
            const matchQuery = !query || 
                               store.name.toLowerCase().includes(query) || 
                               store.address.toLowerCase().includes(query) ||
                               store.locationType.toLowerCase().includes(query);
            
            let matchTab = true;
            if (currentTab === 'fav') matchTab = favorites.includes(store.id);
            if (currentTab === 'visited') matchTab = visited.includes(store.id);

            return matchCategory && matchQuery && matchTab;
        });

        renderStores(filtered);
    }

    function renderStores(stores) {
        const container = document.getElementById('results');
        const countEl = document.getElementById('resultsCount');
        container.innerHTML = '';

        countEl.textContent = `${stores.length} 件が見つかりました`;

        if (stores.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-sub);">該当する店舗がありません</div>`;
            return;
        }

        stores.forEach(store => {
            const isFav = favorites.includes(store.id);
            const isVisited = visited.includes(store.id);
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('石川県小松市 ' + store.name + ' ' + store.address)}`;

            const card = document.createElement('article');
            card.className = 'store-card';
            card.innerHTML = `
                <div class="card-top">
                    <h2 class="store-name">${escapeHtml(store.name)}</h2>
                    <div class="card-actions">
                        <button class="action-btn fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${escapeHtml(store.id)}')">
                            ${isFav ? '❤️' : '🤍'}
                        </button>
                        <button class="action-btn visited-btn ${isVisited ? 'active' : ''}" onclick="toggleVisited('${escapeHtml(store.id)}')">
                            ${isVisited ? '✅' : '⚪'}
                        </button>
                    </div>
                </div>
                <div class="tag-group">
                    <span class="badge badge-category">${escapeHtml(store.category)}</span>
                    ${store.locationType !== '独立店舗' ? `<span class="badge badge-facility">🏬 ${escapeHtml(store.locationType)}</span>` : ''}
                </div>
                <a href="${mapUrl}" target="_blank" class="store-address">
                    📍 ${escapeHtml(store.address)} ↗
                </a>
            `;
            container.appendChild(card);
        });
    }

    // お気に入り・行った機能のロジック
    function toggleFav(id) {
        if (favorites.includes(id)) {
            favorites = favorites.filter(i => i !== id);
        } else {
            favorites.push(id);
        }
        localStorage.setItem('komatsu_favs', JSON.stringify(favorites));
        filterStores();
    }

    function toggleVisited(id) {
        if (visited.includes(id)) {
            visited = visited.filter(i => i !== id);
        } else {
            visited.push(id);
        }
        localStorage.setItem('komatsu_visited', JSON.stringify(visited));
        filterStores();
    }

    function setTab(type, btn) {
        currentTab = type;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterStores();
    }

    // ガチャ機能
    function runGacha() {
        if (allStores.length === 0) return;
        const randomStore = allStores[Math.floor(Math.random() * allStores.length)];
        
        document.getElementById('gachaResultName').textContent = randomStore.name;
        document.getElementById('gachaResultCategory').textContent = randomStore.category;
        document.getElementById('gachaResultMap').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('石川県小松市 ' + randomStore.name)}`;
        
        document.getElementById('gachaModal').classList.add('active');
    }

    function closeGacha() {
        document.getElementById('gachaModal').classList.remove('active');
    }

    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    document.getElementById('searchInput').addEventListener('input', filterStores);
    document.getElementById('categorySelect').addEventListener('change', filterStores);

    window.onload = loadStores;
</script>
</body>
</html>
